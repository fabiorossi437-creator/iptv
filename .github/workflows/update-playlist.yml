name: Aggiorna playlist IPTV

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Scarica playlist completa
        run: |
          curl -L https://iptv-org.github.io/iptv/countries/it.m3u -o completa.m3u

      - name: Filtra canali scelti
        run: |
          python3 <<'EOF'
          import re

          wanted = [
          "Rai 1","Rai 2","Rai 3","Rai 4","Rai 5",
          "Rai Movie","Rai Premium","Rai News 24","Rai Sport",
          "Rai Gulp","Rai Yoyo",
          "Rete 4","Canale 5","Italia 1","20",
          "Twentyseven","La5","Iris","Top Crime","Focus",
          "Mediaset Extra","TGCOM24",
          "La7","La7d","TV8","Nove",
          "Real Time","DMAX","Motor Trend","Giallo",
          "Food Network","HGTV",
          "Boing","K2","Frisbee","Super!",
          "Sky TG24",
          "Sportitalia","Sportitalia SoloCalcio",
          "SuperTennis",
          "Radio Italia TV","RTL 102.5 TV"
          ]

          with open("completa.m3u", encoding="utf-8") as f:
              data = f.read().splitlines()

          out = ["#EXTM3U"]

          for i,line in enumerate(data):
              if line.startswith("#EXTINF"):
                  if any(x.lower() in line.lower() for x in wanted):
                      out.append(line)
                      if i+1 < len(data):
                          out.append(data[i+1])

          with open("playlist.m3u","w",encoding="utf-8") as f:
              f.write("\n".join(out))
          EOF

      - name: Salva modifiche
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist.m3u
          git commit -m "Playlist filtrata aggiornata" || exit 0
          git push
